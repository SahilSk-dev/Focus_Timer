name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - "Focus_Timer_Android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 36 & Build Tools
        run: |
          SDK_MANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare Android signing & env
        working-directory: Focus_Timer_Android
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "Using DEBUG_KEYSTORE_BASE64 secret: YES"
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Using DEBUG_KEYSTORE_BASE64 secret: NO (generating ephemeral keystore)"
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:" || true

      - name: Build Debug APK
        working-directory: Focus_Timer_Android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK for distribution
        run: cp Focus_Timer_Android/app/build/outputs/apk/debug/app-debug.apk focus-timer-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: focus-timer-debug-apk
          path: focus-timer-debug.apk
          retention-days: 30

      - name: Publish APK to Latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Focus Timer Android (Latest)
          body: Automated debug APK build from commit `${{ github.sha }}`.
          files: focus-timer-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
